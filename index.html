    const playSynthSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.06);
        } else if (type === 'coin') {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();
          osc1.type = 'sine';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(987.77, now);
          osc1.frequency.setValueAtTime(1318.51, now + 0.08);
          osc2.frequency.setValueAtTime(1318.51, now);
          osc2.frequency.setValueAtTime(1760.00, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);
          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.36);
          osc2.stop(now + 0.36);
        } else if (type === 'warp') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.exponentialRampToValueAtTime(1200, now + 0.4);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.46);
        }
      } catch (e) {}
    };

          <header className="sticky top-0 z-40 bg-[#050813]/90 backdrop-blur-md border-b border-blue-900/40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-cyan-500 flex items-center justify-center font-black text-xl shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                  B
                </div>
                <div>
                  <div className="text-xl font-black tracking-wider text-white font-heading leading-tight">
                    BIG<span className="text-cyan-400">SMP</span>
                  </div>
                  <div className="text-[10px] text-gray-400 font-mono tracking-widest uppercase">
                    1.21+ • oyna.bigsmp.xyz
                  </div>
                </div>
              </div>

              <div className="hidden md:flex items-center gap-6 text-sm font-semibold text-gray-300">
                <a href="#store" className="hover:text-cyan-400 transition-colors">Mağaza</a>
                <a href="#leaderboard" className="hover:text-cyan-400 transition-colors">Sıralama</a>
                <a href="#faq" className="hover:text-cyan-400 transition-colors">Kurallar & SSS</a>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setIsSupportOpen(true)}
                  className="px-3.5 py-2 bg-[#090e20] hover:bg-blue-900/40 border border-blue-800/50 rounded-xl text-xs font-bold text-gray-300 transition-all"
                >
                  🎧 Destek
                </button>

                <button
                  onClick={() => setIsCartOpen(true)}
                  className="relative px-4 py-2.5 bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 rounded-xl text-xs sm:text-sm font-bold text-white shadow-[0_0_20px_rgba(59,130,246,0.4)] flex items-center gap-2"
                >
                  🛒 Sepet
                  {cart.length > 0 && (
                    <span className="bg-red-500 text-white text-[11px] font-black w-5 h-5 rounded-full flex items-center justify-center">
                      {cart.reduce((a, b) => a + b.qty, 0)}
                    </span>
                  )}
                </button>
              </div>

            </div>
          </header>

          {/* HERO */}
          <section className="relative overflow-hidden pt-12 pb-20 bg-cosmic-nebula text-center">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
              
              <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-blue-950/80 border border-blue-500/30 text-cyan-400 text-xs font-mono font-bold mb-6">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>SUNUCU AKTİF • 70/500 ÇEVRİMİÇİ OYUNCU</span>
              </div>

              <h1 className="text-4xl sm:text-6xl lg:text-7xl font-extrabold tracking-tight text-white mb-6 font-heading">
                TÜRKİYE'NİN EN İYİ <br className="hidden sm:block" />
                <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500">
                  MINECRAFT SMP SUNUCUSU
                </span>
              </h1>

              <p className="max-w-2xl mx-auto text-gray-300 text-base sm:text-lg mb-8 leading-relaxed">
                Resmi BIGSMP mağazasına hoş geldiniz! Yetkiler, ucuz kristaller, özel PvP setleri ve Shopier güvencesiyle anında teslimat.
              </p>

              <div className="flex flex-wrap items-center justify-center gap-4">
                
                <button
                  onClick={handleCopyIp}
                  className="px-6 py-3.5 bg-[#090e20] hover:bg-[#101838] border border-cyan-500/50 hover:border-cyan-400 rounded-2xl font-mono text-sm sm:text-base font-bold text-cyan-300 shadow-[0_0_25px_rgba(34,211,238,0.25)] flex items-center gap-3 transition-all"
                >
                  <span>IP: <strong className="text-white">oyna.bigsmp.xyz</strong></span>
                  <span className="px-2 py-0.5 bg-cyan-500/20 text-cyan-400 rounded text-xs">
                    {copiedIp ? 'KOPYALANDI!' : 'KOPYALA'}
                  </span>
                </button>

                <a
                  href="#store"
                  className="px-6 py-3.5 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 text-white font-bold text-sm sm:text-base rounded-2xl shadow-[0_0_30px_rgba(59,130,246,0.5)] transition-all flex items-center gap-2"
                >
                  ⚡ Mağazayı Keşfet
                </a>

                <a
                  href={SERVER_INFO.discordUrl}
                  target="_blank"
                  rel="noreferrer"
                  className="px-5 py-3.5 bg-[#5865F2]/20 hover:bg-[#5865F2] border border-[#5865F2]/50 text-indigo-200 hover:text-white font-bold text-sm rounded-2xl transition-all"
                >
                  💬 Discord (540 Üye)
                </a>

              </div>

            </div>
          </section>

          {/* STORE */}
          <main id="store" className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 w-full">
            
            <div className="flex flex-wrap items-center justify-center gap-3 mb-8">
              {[
                { id: 'all', label: 'Tüm Ürünler' },
                { id: 'ranks', label: '👑 Yetki & Ranklar' },
                { id: 'crystals', label: '💎 Kristaller' },
                { id: 'kits', label: '⚔️ Özel Kitler & Eşyalar' },
              ].map(cat => (
                <button
                  key={cat.id}
                  onClick={() => {
                    playSynthSound('click');
                    setCategory(cat.id);
                  }}
                  className={`px-5 py-3 rounded-2xl font-bold text-sm transition-all ${
                    category === cat.id
                      ? 'bg-blue-600 text-white shadow-[0_0_20px_rgba(59,130,246,0.5)] scale-105'
                      : 'bg-[#090e20] text-gray-400 hover:text-white border border-blue-900/40'
                  }`}
                >
                  {cat.label}
                </button>
              ))}
            </div>

            <div className="max-w-xl mx-auto mb-10 flex flex-col sm:flex-row gap-3">
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Ürün veya yetki ara... (örn. BOLD, Kristal, Gladyatör)"
                className="flex-1 px-4 py-3 bg-[#090e20] border border-blue-800/40 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400"
              />
              {category === 'ranks' && (
                <select
                  value={vipDurationFilter}
                  onChange={(e) => setVipDurationFilter(e.target.value)}
                  className="px-4 py-3 bg-[#090e20] border border-blue-800/40 rounded-xl text-sm text-cyan-300 focus:outline-none focus:border-cyan-400"
                >
                  <option value="all">Tüm Süreler</option>
                  <option value="lifetime">Süresiz / Sınırsız</option>
                  <option value="30-days">30 Günlük</option>
                </select>
              )}
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {filteredProducts.map(prod => (
                <div
                  key={prod.id}
                  className="bg-cosmic-card border border-blue-900/40 hover:border-cyan-500/50 rounded-2xl p-6 flex flex-col justify-between transition-all hover:-translate-y-1 hover:shadow-[0_0_30px_rgba(59,130,246,0.2)]"
                >
                  <div>
                    <div className="flex items-center justify-between mb-4">
                      <span className={`px-3 py-1 rounded-full text-[11px] font-extrabold uppercase tracking-wider text-white bg-gradient-to-r ${prod.badgeColor}`}>
                        {prod.tag}
                      </span>
                      <span className="text-xs text-gray-400 font-mono">
                        {prod.duration}
                      </span>
                    </div>

                    <h3 className="text-2xl font-black text-white font-heading mb-2">
                      {prod.name}
                    </h3>
                    
                    <p className="text-sm text-gray-300 mb-6 leading-relaxed">
                      {prod.description}
                    </p>

                    <div className="space-y-2 mb-6">
                      {prod.perks.map((perk, i) => (
                        <div key={i} className="flex items-center gap-2 text-xs font-semibold text-gray-300">
                          <span className="text-cyan-400">✓</span>
                          <span>{perk}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="pt-4 border-t border-blue-900/40 flex items-center justify-between">
                    <div>
                      {prod.originalPrice && (
                        <div className="text-xs text-gray-500 line-through font-mono">
                          {prod.originalPrice} ₺
                        </div>
                      )}
                      <div className="text-2xl font-black text-cyan-400 font-mono">
                        {prod.price} ₺
                      </div>
                    </div>

                    <button
                      onClick={() => addToCart(prod)}
                      className="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white text-xs font-black uppercase tracking-wider rounded-xl shadow-[0_0_15px_rgba(59,130,246,0.4)] transition-all cursor-pointer"
                    >
                      Sepete Ekle
                    </button>
                  </div>

                </div>
              ))}
            </div>

          </main>

          {/* LEADERBOARD & RECENT PURCHASES */}
          <section id="leaderboard" className="py-16 bg-[#040714] border-t border-blue-900/30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                
                <div className="bg-[#090e20] p-6 rounded-2xl border border-blue-900/40">
                  <h3 className="text-xl font-black text-white font-heading mb-4 flex items-center gap-2">
                    🏆 En Çok Katkı Sağlayanlar (Liderler)
                  </h3>
                  <div className="space-y-3">
                    {TOP_SPENDERS.map(s => (
                      <div key={s.rank} className="flex items-center justify-between p-3 bg-[#0c142c] rounded-xl border border-blue-900/20">
                        <div className="flex items-center gap-3">
                          <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-black ${
                            s.rank === 1 ? 'bg-amber-400 text-black' : s.rank === 2 ? 'bg-gray-300 text-black' : s.rank === 3 ? 'bg-amber-700 text-white' : 'bg-blue-900 text-white'
                          }`}>
                            {s.rank}
                          </span>
                          <span className="font-bold text-sm text-white">{s.username}</span>
                          <span className={`text-xs font-mono font-bold ${s.roleColor}`}>[{s.role}]</span>
                        </div>
                        <span className="text-cyan-400 font-mono font-black text-sm">{s.amount} ₺</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-[#090e20] p-6 rounded-2xl border border-blue-900/40">
                  <h3 className="text-xl font-black text-white font-heading mb-4 flex items-center gap-2">
                    ⚡ Canlı Satın Alımlar
                  </h3>
                  <div className="space-y-3">
                    {RECENT_PURCHASES.map(p => (
                      <div key={p.id} className="flex items-center justify-between p-3 bg-[#0c142c] rounded-xl border border-blue-900/20">
                        <div>
                          <div className="text-sm font-bold text-white flex items-center gap-2">
                            <span>{p.username}</span>
                            <span className="text-xs px-2 py-0.5 bg-blue-950 text-cyan-400 rounded">{p.category}</span>
                          </div>
                          <div className="text-xs text-gray-400">{p.item}</div>
                        </div>
                        <div className="text-right">
                          <div className="text-sm font-mono font-bold text-emerald-400">{p.price} ₺</div>
                          <div className="text-[10px] text-gray-500">{p.timeAgo}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>
          </section>

          {/* FAQ */}
          <section id="faq" className="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
            <h2 className="text-3xl font-extrabold text-center text-white font-heading mb-10">
              Sıkça Sorulan Sorular & Bilgiler
            </h2>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {FAQ_ITEMS.map((item, i) => (
                <div key={i} className="bg-[#090e20] p-6 rounded-2xl border border-blue-900/40">
                  <h4 className="text-base font-bold text-cyan-300 mb-2">{item.q}</h4>
                  <p className="text-sm text-gray-400 leading-relaxed">{item.a}</p>
                </div>
              ))}
            </div>
          </section>

          {/* FOOTER */}
          <footer className="bg-[#04060e] border-t border-blue-900/40 py-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-gray-500 space-y-3">
              <div className="text-base font-black text-white font-heading">BIGSMP MINECRAFT TOPLULUĞU</div>
              <p>BIGSMP resmi bir Mojang AB ürünü değildir. Mojang veya Microsoft ile herhangi bir ortaklığı yoktur.</p>
              <p>© 2026 BIGSMP. Tüm hakları saklıdır. Sunucu IP: oyna.bigsmp.xyz</p>
            </div>
          </footer>

          {/* CART DRAWER */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/70 backdrop-blur-sm">
              <div className="w-full max-w-md bg-[#080d1e] border-l border-blue-900/50 p-6 flex flex-col h-full overflow-y-auto">
                
                <div className="flex items-center justify-between pb-4 border-b border-blue-900/40">
                  <h3 className="text-xl font-bold text-white font-heading">Alışveriş Sepetiniz</h3>
                  <button onClick={() => setIsCartOpen(false)} className="text-gray-400 hover:text-white text-lg font-bold">✕</button>
                </div>

                <div className="flex-1 py-4 space-y-3 overflow-y-auto">
                  {cart.length === 0 ? (
                    <div className="text-center py-16 text-gray-400">
                      <div className="text-4xl mb-2">🛒</div>
                      <p>Sepetiniz şu an boş.</p>
                    </div>
                  ) : (
                    cart.map(item => (
                      <div key={item.product.id} className="p-3 bg-[#0c142c] rounded-xl border border-blue-900/30 flex items-center justify-between">
                        <div>
                          <div className="font-bold text-sm text-white">{item.product.name}</div>
                          <div className="text-xs text-cyan-400 font-mono">{item.product.price} ₺ x {item.qty}</div>
                        </div>
                        <div className="flex items-center gap-2">
                          <button onClick={() => updateQty(item.product.id, item.qty - 1)} className="w-7 h-7 bg-blue-950 text-white rounded font-bold hover:bg-blue-900">-</button>
                          <span className="font-mono text-sm font-bold">{item.qty}</span>
                          <button onClick={() => updateQty(item.product.id, item.qty + 1)} className="w-7 h-7 bg-blue-950 text-white rounded font-bold hover:bg-blue-900">+</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="pt-4 border-t border-blue-900/40 space-y-4">
                    
                    <div className="flex gap-2">
                      <input
                        type="text"
                        placeholder="Kupon Kodu (örn. BIGSMP20)"
                        value={couponCode}
                        onChange={(e) => setCouponCode(e.target.value)}
                        className="flex-1 px-3 py-2 bg-[#0c142c] border border-blue-900/40 rounded-xl text-xs text-white uppercase focus:outline-none focus:border-cyan-400"
                      />
                      <button
                        onClick={applyCoupon}
                        className="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-xl text-xs font-bold text-white"
                      >
                        Uygula
                      </button>
                    </div>

                    <div className="flex justify-between items-center text-sm">
                      <span className="text-gray-400">Toplam Tutar:</span>
                      <div className="text-right">
                        {discount > 0 && (
                          <div className="text-xs text-gray-500 line-through font-mono">{cartTotal} ₺</div>
                        )}
                        <div className="text-2xl font-black text-cyan-400 font-mono">{discountedTotal} ₺</div>
                      </div>
                    </div>

                    <button
                      onClick={() => {
                        setIsCartOpen(false);
                        setIsCheckoutOpen(true);
                      }}
                      className="w-full py-3.5 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 font-bold text-white rounded-xl shadow-[0_0_20px_rgba(59,130,246,0.4)]"
                    >
                      Shopier ile Öde ({discountedTotal} ₺)
                    </button>

                  </div>
                )}

              </div>
            </div>
          )}

          {/* CHECKOUT MODAL (SHOPIER) */}
          {isCheckoutOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="w-full max-w-lg bg-[#090e20] border border-cyan-500/40 rounded-3xl p-6 sm:p-8 space-y-6 shadow-[0_0_50px_rgba(59,130,246,0.3)]">
                
                <div className="flex items-center justify-between border-b border-blue-900/40 pb-4">
                  <h3 className="text-xl font-bold text-white font-heading">Shopier Güvenli Ödeme</h3>
                  <button onClick={() => setIsCheckoutOpen(false)} className="text-gray-400 hover:text-white font-bold">✕</button>
                </div>

                <div>
                  <label className="block text-xs font-mono text-cyan-300 font-bold mb-2">
                    MINECRAFT KULLANICI ADINIZ *
                  </label>
                  <input
                    type="text"
                    placeholder="Oyundaki tam adınız (örn. Notch, WazyW)"
                    value={minecraftUser}
                    onChange={(e) => setMinecraftUser(e.target.value)}
                    className="w-full px-4 py-3 bg-[#0c142c] border border-blue-800/60 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400"
                  />
                  <p className="text-[11px] text-gray-400 mt-1">Ödeme sonrası eşyalar bu kullanıcı adına otomatik teslim edilir.</p>
                </div>

                <div className="p-4 bg-[#0c142c] rounded-xl border border-blue-900/30 space-y-2">
                  <div className="flex justify-between text-xs text-gray-400">
                    <span>Ödeme Altyapısı:</span>
                    <span className="text-purple-400 font-bold">Shopier (3D Secure)</span>
                  </div>
                  <div className="flex justify-between text-xs text-gray-400">
                    <span>Ödenecek Tutar:</span>
                    <span className="text-cyan-400 font-mono font-bold text-base">{discountedTotal} ₺</span>
                  </div>
                </div>

                <button
                  onClick={proceedToShopier}
                  className="w-full py-4 bg-gradient-to-r from-purple-600 via-blue-600 to-cyan-500 hover:opacity-90 font-black text-white text-base rounded-2xl shadow-[0_0_25px_rgba(147,51,234,0.4)] transition-all cursor-pointer flex items-center justify-center gap-2"
                >
                  <span>🔐 Shopier ile Güvenli Öde ({discountedTotal} ₺)</span>
                </button>

              </div>
            </div>
          )}

          {/* SUPPORT MODAL */}
          {isSupportOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="w-full max-w-md bg-[#090e20] border border-blue-500/40 rounded-3xl p-6 space-y-6">
                <div className="flex justify-between items-center border-b border-blue-900/40 pb-3">
                  <h3 className="text-lg font-bold text-white">7/24 Destek & İletişim</h3>
                  <button onClick={() => setIsSupportOpen(false)} className="text-gray-400 hover:text-white font-bold">✕</button>
                </div>
                <p className="text-sm text-gray-300 leading-relaxed">
                  Ödeme veya teslimat konularında herhangi bir sorun yaşarsanız Discord sunucumuzdaki <strong>#destek</strong> kanalından bilet açabilirsiniz.
                </p>
                <a
                  href={SERVER_INFO.discordUrl}
                  target="_blank"
                  rel="noreferrer"
                  className="block w-full py-3 bg-[#5865F2] hover:bg-[#4752c4] text-center font-bold text-white rounded-xl"
                >
                  💬 Discord Destek Kanalına Git
                </a>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
