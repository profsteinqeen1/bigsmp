<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigSMP | Minecraft Sunucusu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .ip-box {
            background: #090d16;
            border: 2px dashed #38bdf8;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #38bdf8;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .ip-box:hover {
            background: #1e293b;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>BigSMP</h1>
        <p>En iyi Minecraft hayatta kalma deneyimi için aramıza katıl!</p>
        
        <div class="ip-box" onclick="navigator.clipboard.writeText('oyna.bigsmp.xyz'); alert('Sunucu IP adresi kopyalandı!');">
            Sunucu IP: oyna.bigsmp.xyz
        </div>
        
        <div class="footer">
            &copy; 2026 BigSMP. Tüm hakları saklıdır.
        </div>
    </div>

</body>
</html>
